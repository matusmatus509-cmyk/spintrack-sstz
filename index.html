<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SpinTrack SSTZ - Stolnotenisový Denník & Výstroj</title>
    <meta name="description" content="Sledovanie stolnotenisového vybavenia, poťahov a dreva s priamym prepojením na SSTZ výsledky, ligy a rozpis zápasov." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#f4f6f2" />
    <script src="/theme.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpinTrack" />
    <meta name="application-name" content="SpinTrack" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SpinTrack SW registered:', reg.scope))
            .catch(err => console.warn('SpinTrack SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
